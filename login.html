<!doctype html><html><head><meta charset="utf-8"><title>Admin Login</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
<style>
:root{--bg:#e9edf3;--card:#fff;--text:#0f1b2d;--muted:#667;--input:#fff;--inputb:#bbc;--btn:#0f1b2d;--btnt:#fff;--red:#d61f26}
[data-theme=dark]{--bg:#0b1220;--card:#141d2f;--text:#e6ebf5;--muted:#93a0b8;--input:#0f1729;--inputb:#33415f;--btn:#d61f26;--btnt:#fff;--red:#ff5c62}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Segoe UI,system-ui,sans-serif}
form{background:var(--card);padding:32px;border-radius:8px;width:300px;border-top:5px solid #d61f26;text-align:center}
.logo{max-width:150px;max-height:90px;margin:0 auto 14px;display:block}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
input{width:100%;box-sizing:border-box;padding:10px;margin-bottom:12px;border:1px solid var(--inputb);border-radius:4px;background:var(--input);color:var(--text);text-align:left}
form button{width:100%;padding:10px;background:var(--btn);color:var(--btnt);border:0;border-radius:4px;font-size:15px;cursor:pointer}
.err{color:var(--red);font-size:14px;margin-bottom:10px;text-align:left}
#tg{position:fixed;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--inputb);background:var(--card);color:var(--text);cursor:pointer;font-size:17px;line-height:1}
</style></head><body>
<button id="tg" type="button" onclick="toggleTheme()" title="Toggle theme"></button>
<form method="post">
<img class="logo" src="{{ url_for('static', filename='logo.png') }}" alt="Company logo">
<p>Admin sign in</p>
{% if locked %}
<div class="err">Too many failed attempts. Try again in <b id="t">{{ locked }}</b> seconds.</div>
<script>let s={{ locked }};setInterval(()=>{s--;t.textContent=s;if(s<=0)location.reload()},1000)</script>
{% else %}
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<input name="username" placeholder="Username" required autofocus>
<input name="password" type="password" placeholder="Password" required>
<button>Sign in</button>
{% endif %}
</form>
<script>
function lab(){tg.textContent=document.documentElement.dataset.theme=='dark'?'\u2600':'\ud83c\udf19'}
function toggleTheme(){const n=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}lab()}
lab();
</script></body></html>
